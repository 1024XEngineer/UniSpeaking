services:
  postgres:
    image: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unispeaking}
      POSTGRES_USER: ${POSTGRES_USER:-unispeaking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ../backend/unispeaking-server
      args:
        DOCKER_IMAGE_REGISTRY: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}
        MAVEN_REPO_URL: ${MAVEN_REPO_URL:-https://maven.aliyun.com/repository/public}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PADDLE_PDX_MODEL_SOURCE: ${PADDLE_PDX_MODEL_SOURCE:-bos}
    env_file:
      - path: ./env/.env
        required: false
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-unispeaking-backend}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - monitoring
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend/web
      args:
        DOCKER_IMAGE_REGISTRY: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-/backend}
        VITE_FEEDBACK_URL: ${VITE_FEEDBACK_URL:-}
        VITE_ALIYUN_CAPTCHA_SCENE_ID: ${ALIYUN_CAPTCHA_SCENE_ID:-}
        VITE_ALIYUN_CAPTCHA_PREFIX: ${ALIYUN_CAPTCHA_PREFIX:-}
        VITE_ALIYUN_CAPTCHA_REGION: ${ALIYUN_CAPTCHA_REGION:-cn}
        VITE_UMAMI_ENABLED: ${VITE_UMAMI_ENABLED:-false}
        VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL:-https://cloud.umami.is/script.js}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
        VITE_UMAMI_DOMAINS: ${VITE_UMAMI_DOMAINS:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_APP_RELEASE: ${VITE_APP_RELEASE:-web@production}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    expose:
      - "80"
    restart: unless-stopped

  admin:
    build:
      context: ../frontend/admin
      args:
        DOCKER_IMAGE_REGISTRY: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-/backend}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}/library/nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/unispeaking/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
      - admin
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  monitoring:
    name: ${MONITORING_NETWORK_NAME:-monitoring_default}
    external: true
