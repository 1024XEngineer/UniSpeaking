services:
  postgres:
    image: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unispeaking}
      POSTGRES_USER: ${POSTGRES_USER:-unispeaking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    image: deploy-backend:latest
    build:
      context: ../backend/unispeaking-server
      args:
        DOCKER_IMAGE_REGISTRY: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}
        MAVEN_REPO_URL: ${MAVEN_REPO_URL:-https://maven.aliyun.com/repository/public}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PADDLE_PDX_MODEL_SOURCE: ${PADDLE_PDX_MODEL_SOURCE:-bos}
    env_file:
      - path: ./env/.env
        required: false
    environment:
      # Set JAVA_TOOL_OPTIONS to a valid agent path only after the host JAR has
      # been verified. The empty default keeps the service bootable otherwise.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-unispeaking-backend}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      MANAGEMENT_PROMETHEUS_ENABLED: ${MANAGEMENT_PROMETHEUS_ENABLED:-true}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,prometheus}
    expose:
      - "8080"
    volumes:
      - ${OTEL_JAVA_AGENT_HOST_PATH:-/opt/monitoring/opentelemetry-javaagent.jar}:/opt/otel/opentelemetry-javaagent.jar:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - monitoring
    labels:
      logging: "promtail"
      service: "unispeaking-backend"
      monitoring: "prometheus"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  frontend:
    image: deploy-frontend:latest
    build:
      context: ../frontend/web
      args:
        DOCKER_IMAGE_REGISTRY: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-/backend}
        VITE_OCR_ENABLED: ${VITE_OCR_ENABLED:-true}
        VITE_AUTH_CAPTCHA_PROVIDER: ${VITE_AUTH_CAPTCHA_PROVIDER:-aliyun}
        VITE_FEEDBACK_URL: ${VITE_FEEDBACK_URL:-}
        VITE_ALIYUN_CAPTCHA_SCENE_ID: ${VITE_ALIYUN_CAPTCHA_SCENE_ID:-}
        VITE_ALIYUN_CAPTCHA_PREFIX: ${VITE_ALIYUN_CAPTCHA_PREFIX:-}
        VITE_ALIYUN_CAPTCHA_REGION: ${VITE_ALIYUN_CAPTCHA_REGION:-cn}
        VITE_UMAMI_ENABLED: ${VITE_UMAMI_ENABLED:-false}
        VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL:-https://cloud.umami.is/script.js}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
        VITE_UMAMI_DOMAINS: ${VITE_UMAMI_DOMAINS:-}
        VITE_REALTIME_ICE_TRANSPORT_POLICY: ${VITE_REALTIME_ICE_TRANSPORT_POLICY:-all}
        VITE_REALTIME_TURN_ENABLED: ${VITE_REALTIME_TURN_ENABLED:-false}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_APP_RELEASE: ${VITE_APP_RELEASE:-web@production}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    expose:
      - "80"
    restart: unless-stopped

  admin:
    image: deploy-admin:latest
    build:
      context: ../frontend/admin
      args:
        DOCKER_IMAGE_REGISTRY: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-/backend}
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL:-http://218.11.5.202:3001}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}/library/nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/unispeaking/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
      - admin
    restart: unless-stopped

  turn:
    image: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}/coturn/coturn:4.6.3-alpine
    profiles: ["turn"]
    network_mode: host
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$$TURN_SHARED_SECRET"
        test -n "$$TURN_PUBLIC_IP"
        test -n "$$TURN_PRIVATE_IP"
        exec turnserver -c /etc/coturn/turnserver.conf \
          --realm="$$TURN_REALM" \
          --static-auth-secret="$$TURN_SHARED_SECRET" \
          --external-ip="$$TURN_PUBLIC_IP/$$TURN_PRIVATE_IP" \
          --relay-ip="$$TURN_PRIVATE_IP"
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:-}
      TURN_PRIVATE_IP: ${TURN_PRIVATE_IP:-}
      TURN_REALM: ${TURN_REALM:-turn.unispeaking.qnsdk.com}
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: deploy_postgres_data

networks:
  monitoring:
    name: ${MONITORING_NETWORK_NAME:-monitoring_default}
    external: true
