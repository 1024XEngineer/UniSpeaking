services:
  postgres:
    image: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unispeaking}
      POSTGRES_USER: ${POSTGRES_USER:-unispeaking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    image: ${UNISPEAKING_BACKEND_IMAGE:?UNISPEAKING_BACKEND_IMAGE is required}
    env_file:
      - path: ./env/.env
        required: false
    environment:
      # Set JAVA_TOOL_OPTIONS to a valid agent path only after the host JAR has
      # been verified. The empty default keeps the service bootable otherwise.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-unispeaking-backend}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      MANAGEMENT_PROMETHEUS_ENABLED: ${MANAGEMENT_PROMETHEUS_ENABLED:-true}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,prometheus}
    expose:
      - "8080"
    volumes:
      - ${OTEL_JAVA_AGENT_HOST_PATH:-/opt/monitoring/opentelemetry-javaagent.jar}:/opt/otel/opentelemetry-javaagent.jar:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - monitoring
    labels:
      logging: "promtail"
      service: "unispeaking-backend"
      monitoring: "prometheus"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  frontend:
    image: ${UNISPEAKING_FRONTEND_IMAGE:?UNISPEAKING_FRONTEND_IMAGE is required}
    expose:
      - "80"
    restart: unless-stopped

  admin:
    image: ${UNISPEAKING_ADMIN_IMAGE:?UNISPEAKING_ADMIN_IMAGE is required}
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}/library/nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/unispeaking/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
      - admin
    restart: unless-stopped

  turn:
    image: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}/coturn/coturn:4.6.3-alpine
    profiles: ["turn"]
    network_mode: host
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$$TURN_SHARED_SECRET"
        test -n "$$TURN_PUBLIC_IP"
        test -n "$$TURN_PRIVATE_IP"
        exec turnserver -c /etc/coturn/turnserver.conf \
          --realm="$$TURN_REALM" \
          --static-auth-secret="$$TURN_SHARED_SECRET" \
          --external-ip="$$TURN_PUBLIC_IP/$$TURN_PRIVATE_IP" \
          --relay-ip="$$TURN_PRIVATE_IP"
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:-}
      TURN_PRIVATE_IP: ${TURN_PRIVATE_IP:-}
      TURN_REALM: ${TURN_REALM:-turn.unispeaking.qnsdk.com}
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: deploy_postgres_data

networks:
  monitoring:
    name: ${MONITORING_NETWORK_NAME:-monitoring_default}
    external: true
