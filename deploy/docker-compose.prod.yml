services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unispeaking}
      POSTGRES_USER: ${POSTGRES_USER:-unispeaking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ../backend/unispeaking-server
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://deb.debian.org/debian-security}
        MAVEN_REPO_URL: ${MAVEN_REPO_URL:-https://repo.maven.apache.org/maven2}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
        PADDLE_PDX_MODEL_SOURCE: ${PADDLE_PDX_MODEL_SOURCE:-bos}
    env_file:
      - path: ./env/.env
        required: false
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend/web
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-/backend}
        VITE_FEEDBACK_URL: ${VITE_FEEDBACK_URL:-}
        VITE_ALIYUN_CAPTCHA_SCENE_ID: ${ALIYUN_CAPTCHA_SCENE_ID:-}
        VITE_ALIYUN_CAPTCHA_PREFIX: ${ALIYUN_CAPTCHA_PREFIX:-}
        VITE_ALIYUN_CAPTCHA_REGION: ${ALIYUN_CAPTCHA_REGION:-cn}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    expose:
      - "80"
    restart: unless-stopped

  admin:
    build:
      context: ../frontend/admin
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-/backend}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/unispeaking/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
      - admin
    restart: unless-stopped

volumes:
  postgres_data:
