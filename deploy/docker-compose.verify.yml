name: unispeaking-cd-verify

services:
  postgres:
    image: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unispeaking_verify}
      POSTGRES_USER: ${POSTGRES_USER:-unispeaking_verify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - verify_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    image: ${UNISPEAKING_BACKEND_IMAGE:?UNISPEAKING_BACKEND_IMAGE is required}
    env_file:
      - path: ./env/.env.verify
        required: true
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-unispeaking-backend-verify}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      MANAGEMENT_PROMETHEUS_ENABLED: ${MANAGEMENT_PROMETHEUS_ENABLED:-false}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  frontend:
    image: ${UNISPEAKING_FRONTEND_IMAGE:?UNISPEAKING_FRONTEND_IMAGE is required}
    expose:
      - "80"
    restart: unless-stopped

  admin:
    image: ${UNISPEAKING_ADMIN_IMAGE:?UNISPEAKING_ADMIN_IMAGE is required}
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}/library/nginx:1.27-alpine
    ports:
      - "${VERIFY_HTTP_PORT:-18080}:80"
    volumes:
      - ./nginx/nginx.verify.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - admin
    networks:
      - default
    restart: unless-stopped

volumes:
  verify_postgres_data:
