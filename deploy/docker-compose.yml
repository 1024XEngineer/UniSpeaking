services:
  postgres:
    image: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unispeaking}
      POSTGRES_USER: ${POSTGRES_USER:-unispeaking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unispeaking-local-password}
    volumes:
      - unispeaking_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ../backend/unispeaking-server
      args:
        DOCKER_IMAGE_REGISTRY: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}
        MAVEN_REPO_URL: ${MAVEN_REPO_URL:-https://maven.aliyun.com/repository/public}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PADDLE_PDX_MODEL_SOURCE: ${PADDLE_PDX_MODEL_SOURCE:-bos}
    env_file:
      - path: ./env/.env
        required: false
    environment:
      DATABASE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-unispeaking}"
      DATABASE_USERNAME: ${POSTGRES_USER:-unispeaking}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-unispeaking-local-password}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend/web
      args:
        DOCKER_IMAGE_REGISTRY: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-/backend}
        VITE_FEEDBACK_URL: ${VITE_FEEDBACK_URL:-}
        VITE_ALIYUN_CAPTCHA_SCENE_ID: ${ALIYUN_CAPTCHA_SCENE_ID:-}
        VITE_ALIYUN_CAPTCHA_PREFIX: ${ALIYUN_CAPTCHA_PREFIX:-}
        VITE_ALIYUN_CAPTCHA_REGION: ${ALIYUN_CAPTCHA_REGION:-cn}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    ports:
      - "3000:80"

  admin:
    build:
      context: ../frontend/admin
      args:
        DOCKER_IMAGE_REGISTRY: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-/backend}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    ports:
      - "5178:80"

  nginx:
    image: ${DOCKER_IMAGE_REGISTRY:-docker.m.daocloud.io}/library/nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - admin

volumes:
  # Keep local development data separate from the production Compose volume.
  unispeaking_dev_postgres_data:
