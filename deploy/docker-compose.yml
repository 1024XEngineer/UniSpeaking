services:
  redis:
    image: redis:7.4-alpine
    env_file:
      - ./env/.env
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "63790:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ../backend/unispeaking-server
    env_file:
      - ./env/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      - redis

  frontend:
    build:
      context: ../frontend/unispeaking-web
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-/backend}
    ports:
      - "3000:80"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  redis-data:
