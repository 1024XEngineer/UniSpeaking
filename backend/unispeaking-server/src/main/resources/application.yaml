spring:
  application:
    name: unispeaking_server
  config:
    import: optional:file:${UNISPEAKING_ENV_FILE:../../deploy/env/.env}[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/unispeaking}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

web:
  allowed-origin-patterns: "${WEB_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://unispeaking.cn,https://www.unispeaking.cn}"

profile:
  time-zone: ${PROFILE_TIME_ZONE:Asia/Shanghai}

ielts:
  daily-reset-cron: ${IELTS_DAILY_RESET_CRON:0 0 0 * * *}
  recording:
    directory: ${IELTS_RECORDING_DIRECTORY:./data/ielts-recordings}
    max-bytes: ${IELTS_RECORDING_MAX_BYTES:10485760}
    ttl: ${IELTS_RECORDING_TTL:7d}

object-storage:
  qiniu:
    access-key: ${QINIU_ACCESS_KEY:}
    secret-key: ${QINIU_SECRET_KEY:}
    bucket: ${QINIU_BUCKET:}
    domain: ${QINIU_DOMAIN:}
    avatar-prefix: ${QINIU_AVATAR_PREFIX:avatars}
    signed-url-ttl: ${QINIU_SIGNED_URL_TTL:1h}

ocr:
  paddle:
    enabled: ${OCR_ENABLED:true}
    python-executable: ${OCR_PYTHON_EXECUTABLE:/opt/ocr-venv/bin/python}
    runner-path: ${OCR_RUNNER_PATH:/app/ocr/paddle_ocr_runner.py}
    model-directory: ${OCR_MODEL_DIRECTORY:/app/ocr/models}
    temp-directory: ${OCR_TEMP_DIRECTORY:}
    timeout: ${OCR_TIMEOUT:120s}

prompt:
  templates:
    directory: ${PROMPT_TEMPLATE_DIR:}

mybatis-plus:
  type-handlers-package: com.unispeaking.common.persistence.typehandler
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# MyBatis-Plus cannot model composite @TableId values. The affected entities
# use full-key wrappers and are guarded by CompositeKeyEntityTest.
logging:
  level:
    com.baomidou.mybatisplus.core.metadata.TableInfoHelper: ERROR
    com.baomidou.mybatisplus.core.injector.DefaultSqlInjector: ERROR

auth:
  jwt:
    issuer: ${JWT_ISSUER:unispeaking}
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:2h}

realtime:
  flow:
    log-file: ${REALTIME_FLOW_LOG_FILE:logs/realtime-flow.log}
  qwen:
    api-key: ${DASHSCOPE_API_KEY:}
    workspace-id: ${BAILIAN_WORKSPACE_ID:}
    model: ${BAILIAN_MODEL:qwen3.5-omni-flash-realtime}
    region: ${BAILIAN_REGION:cn-beijing}
    temporary-key-endpoint: ${REALTIME_QWEN_TEMPORARY_KEY_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/tokens}
    temporary-key-ttl-seconds: ${REALTIME_QWEN_TEMPORARY_KEY_TTL_SECONDS:300}
    connect-timeout: ${REALTIME_QWEN_CONNECT_TIMEOUT:10s}
    read-timeout: ${REALTIME_QWEN_READ_TIMEOUT:20s}
    max-answer-bytes: ${REALTIME_QWEN_MAX_ANSWER_BYTES:1048576}
