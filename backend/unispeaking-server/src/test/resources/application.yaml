spring:
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:unispeaking-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: never

unispeaking:
  auth:
    persistence: in-memory
    captcha:
      provider: development
  admin:
    persistence: postgres
    secure-cookie: false
  integrations:
    usage-source: postgres
    freetalk:
      enabled: false
    aliyun:
      sync-enabled: false

logging:
  level:
    com.baomidou.mybatisplus.core.metadata.TableInfoHelper: ERROR
    com.baomidou.mybatisplus.core.injector.DefaultSqlInjector: ERROR

auth:
  jwt:
    issuer: unispeaking-test
    secret: dGVzdC1qd3Qtc2VjcmV0LXdpdGgtYXQtbGVhc3QtMzItYnl0ZXM=
    access-token-ttl: 1h

realtime:
  qwen:
    api-key: test-key
    workspace-id: test-workspace
    model: qwen3.5-omni-flash-realtime
    region: cn-beijing
    temporary-key-endpoint: https://example.com/api/v1/tokens
    temporary-key-ttl-seconds: 300
    connect-timeout: 1s
    read-timeout: 1s
    max-answer-bytes: 1048576

gateway:
  enabled: false
  credential-ttl-seconds: 300
  session-lease-seconds: 600
  key-failure-cooldown-seconds: 30
