name: CD

on:
  workflow_run:
    workflows:
      - Main CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full main commit SHA to publish or redeploy
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: unispeaking-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/1024xengineer

jobs:
  resolve:
    name: 校验发布对象
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: 校验 main HEAD 与 CI 对象
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            target_sha="$DISPATCH_SHA"
          else
            target_sha="$CI_SHA"
          fi
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "commit SHA 格式无效" >&2; exit 1; }
          if [[ "$EVENT_NAME" != workflow_dispatch && "$target_sha" != "$main_sha" ]]; then
            echo "Main CI 对象不是当前 main HEAD，停止发布。" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            compare_status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$target_sha...$main_sha" --jq '.status')
            [[ "$compare_status" == ahead || "$target_sha" == "$main_sha" ]] || {
              echo "回滚对象不是当前 main 的历史提交，停止发布。" >&2
              exit 1
            }
            successful_required=$(gh run list --workflow ci-main.yml --commit "$target_sha" --status completed --limit 20 --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
            [[ "$successful_required" -gt 0 ]] || {
              echo "回滚对象没有成功的 Main CI 记录，停止发布。" >&2
              exit 1
            }
          fi
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
          if [[ "$target_sha" == "$main_sha" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: 构建并推送 GHCR 镜像
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      admin_digest: ${{ steps.admin.outputs.digest }}
    steps:
      - name: 检出发布提交
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: 登录 GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 backend
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend/unispeaking-server
          file: backend/unispeaking-server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/unispeaking-backend:sha-${{ needs.resolve.outputs.sha }}
            ${{ env.IMAGE_NAMESPACE }}/unispeaking-backend:main
          cache-from: type=gha,scope=unispeaking-backend-cd
          cache-to: type=gha,scope=unispeaking-backend-cd,mode=max

      - name: 构建并推送 frontend
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend/web
          file: frontend/web/Dockerfile
          push: true
          build-args: |
            VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL || '/backend' }}
            VITE_OCR_ENABLED=${{ vars.VITE_OCR_ENABLED || 'true' }}
            VITE_FEEDBACK_URL=${{ vars.VITE_FEEDBACK_URL }}
            VITE_ALIYUN_CAPTCHA_SCENE_ID=${{ vars.VITE_ALIYUN_CAPTCHA_SCENE_ID }}
            VITE_ALIYUN_CAPTCHA_PREFIX=${{ vars.VITE_ALIYUN_CAPTCHA_PREFIX }}
            VITE_ALIYUN_CAPTCHA_REGION=${{ vars.VITE_ALIYUN_CAPTCHA_REGION || 'cn' }}
            VITE_UMAMI_ENABLED=${{ vars.VITE_UMAMI_ENABLED || 'false' }}
            VITE_UMAMI_SCRIPT_URL=${{ vars.VITE_UMAMI_SCRIPT_URL || 'https://cloud.umami.is/script.js' }}
            VITE_UMAMI_WEBSITE_ID=${{ vars.VITE_UMAMI_WEBSITE_ID }}
            VITE_UMAMI_DOMAINS=${{ vars.VITE_UMAMI_DOMAINS }}
            VITE_REALTIME_ICE_TRANSPORT_POLICY=${{ vars.VITE_REALTIME_ICE_TRANSPORT_POLICY || 'all' }}
            VITE_REALTIME_TURN_ENABLED=${{ vars.VITE_REALTIME_TURN_ENABLED || 'false' }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_APP_RELEASE=web@sha-${{ needs.resolve.outputs.sha }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/unispeaking-frontend:sha-${{ needs.resolve.outputs.sha }}
            ${{ env.IMAGE_NAMESPACE }}/unispeaking-frontend:main
          cache-from: type=gha,scope=unispeaking-frontend-cd
          cache-to: type=gha,scope=unispeaking-frontend-cd,mode=max

      - name: 构建并推送 admin
        id: admin
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend/admin
          file: frontend/admin/Dockerfile
          push: true
          build-args: |
            VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL || '/backend' }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/unispeaking-admin:sha-${{ needs.resolve.outputs.sha }}
            ${{ env.IMAGE_NAMESPACE }}/unispeaking-admin:main
          cache-from: type=gha,scope=unispeaking-admin-cd
          cache-to: type=gha,scope=unispeaking-admin-cd,mode=max

  deploy:
    name: 生产部署
    needs:
      - resolve
      - publish
    if: >-
      always() && needs.resolve.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: 检出部署配置
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: 配置 SSH
        shell: bash
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"

      - name: 同步非敏感部署配置
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_DIR: ${{ runner.temp }}/ssh
        shell: bash
        run: |
          set -euo pipefail
          ssh=(ssh -i "$SSH_DIR/id_ed25519" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts")
          scp=(scp -i "$SSH_DIR/id_ed25519" -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts")
          "${scp[@]}" deploy/docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:/tmp/unispeaking-cd-compose.prod.yml"
          "${scp[@]}" deploy/nginx/nginx.prod.conf "$DEPLOY_USER@$DEPLOY_HOST:/tmp/unispeaking-cd-nginx.prod.conf"
          "${scp[@]}" deploy/coturn/turnserver.conf "$DEPLOY_USER@$DEPLOY_HOST:/tmp/unispeaking-cd-turnserver.conf"
          "${scp[@]}" deploy/scripts/deploy-release.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/unispeaking-cd-release.sh"
          "${ssh[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'sudo -n install -d -m 755 /opt/unispeaking-cd/deploy /opt/unispeaking-cd/deploy/nginx /opt/unispeaking-cd/deploy/coturn /opt/unispeaking-cd/deploy/env && sudo -n install -m 644 /tmp/unispeaking-cd-compose.prod.yml /opt/unispeaking-cd/deploy/docker-compose.prod.yml && sudo -n install -m 644 /tmp/unispeaking-cd-nginx.prod.conf /opt/unispeaking-cd/deploy/nginx/nginx.prod.conf && sudo -n install -m 644 /tmp/unispeaking-cd-turnserver.conf /opt/unispeaking-cd/deploy/coturn/turnserver.conf && sudo -n install -m 755 /tmp/unispeaking-cd-release.sh /opt/unispeaking-cd/deploy-release.sh && rm -f /tmp/unispeaking-cd-compose.prod.yml /tmp/unispeaking-cd-nginx.prod.conf /tmp/unispeaking-cd-turnserver.conf /tmp/unispeaking-cd-release.sh'

      - name: 写入镜像版本并执行固定部署入口
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_DIR: ${{ runner.temp }}/ssh
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh=(ssh -i "$SSH_DIR/id_ed25519" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts")
          scp=(scp -i "$SSH_DIR/id_ed25519" -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts")
          printf '%s\n' \
            "UNISPEAKING_BACKEND_IMAGE=ghcr.io/1024xengineer/unispeaking-backend:sha-${RELEASE_SHA}" \
            "UNISPEAKING_FRONTEND_IMAGE=ghcr.io/1024xengineer/unispeaking-frontend:sha-${RELEASE_SHA}" \
            "UNISPEAKING_ADMIN_IMAGE=ghcr.io/1024xengineer/unispeaking-admin:sha-${RELEASE_SHA}" \
            > "$RUNNER_TEMP/images.env"
          "${scp[@]}" "$RUNNER_TEMP/images.env" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/unispeaking-cd-images.env"
          "${ssh[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'sudo -n install -m 600 /tmp/unispeaking-cd-images.env /opt/unispeaking-cd/deploy/env/.images && rm -f /tmp/unispeaking-cd-images.env && sudo -n /opt/unispeaking-cd/deploy-release.sh'
