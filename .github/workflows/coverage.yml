name: Coverage

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/coverage.yml
      - codecov.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-main
  cancel-in-progress: true

jobs:
  backend:
    name: 生成并发布后端覆盖率
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: backend/unispeaking-server
    steps:
      - name: 检出 main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 配置 Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/unispeaking-server/pom.xml

      - name: 运行测试并生成 JaCoCo 聚合报告
        shell: bash
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -Pci-integration,coverage-aggregate
          clean
          verify

      - name: 检查后端 Codecov 口径覆盖率
        run: |
          python3 ../../scripts/check-codecov-coverage.py \
            --format jacoco \
            --input target/site/jacoco-aggregate/jacoco.xml \
            --minimum 90

      - name: 上传 JaCoCo XML 到 Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          use_oidc: true
          files: backend/unispeaking-server/target/site/jacoco-aggregate/jacoco.xml
          disable_search: true
          fail_ci_if_error: true
          flags: backend
          name: backend-aggregate

      - name: 保存 JaCoCo 聚合报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-main-coverage
          path: backend/unispeaking-server/target/site/jacoco-aggregate
          if-no-files-found: error
          retention-days: 30
